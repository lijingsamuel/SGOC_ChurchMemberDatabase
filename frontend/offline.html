<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Church Family Data Collection</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #F4F6F9; color: #1A1D22;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px; text-align: center;
    }
    .box { max-width: 360px; }
    .icon { font-size: 56px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #5C6470; font-size: 14px; }
    button {
      margin-top: 16px; padding: 12px 24px; border: none; border-radius: 10px;
      background: #0057B8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>No internet connection right now. Any family details you've already entered are safely saved on this device and will sync automatically once you're back online.</p>
    <button onclick="location.href='./index.html'">Try Again</button>
  </div>
</body>
</html>
